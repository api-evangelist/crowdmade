name: CrowdMade
description: >-
  CrowdMade partners with online creators from YouTube, Instagram, Snapchat and
  beyond to design, produce, warehouse, and ship official merchandise their fans
  are proud to wear. The public storefront at crowdmade.com runs on Shopify and,
  as of 2026, exposes a machine- and agent-facing commerce surface: a published
  Universal Commerce Protocol (UCP) MCP shopping endpoint, Shopify Customer
  Accounts OpenID Connect / OAuth discovery documents, an llms.txt, and an
  agents.md describing how AI shopping agents can search the catalog, build a
  cart, and complete a buyer-approved checkout. It was surfaced as a portfolio
  company of 500 Global and profiled into the API Evangelist network.
