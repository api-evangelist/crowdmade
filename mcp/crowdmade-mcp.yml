notes: >-
  crowdmade.com is a Shopify storefront that exposes agent-driven commerce via
  the Universal Commerce Protocol (UCP) over MCP. Tools below are the documented
  agent flow from the store's own /llms.txt and /agents.md; full tool schemas
  are served live from the endpoint via tools/list (an agent profile URI is
  required to enumerate them). Capabilities advertised in the UCP profile:
  checkout, fulfillment, discount, cart, order, catalog.search, catalog.lookup.
tools:
  - name: search_catalog
    description: Find products in the store matching the buyer's intent.
  - name: create_cart
    description: Create a cart and add desired items.
  - name: create_checkout
    description: Start the purchase flow for a cart.
  - name: update_checkout
    description: Set shipping address and shipping method on a checkout.
  - name: complete_checkout
    description: Finalize the purchase (requires explicit buyer payment approval).
